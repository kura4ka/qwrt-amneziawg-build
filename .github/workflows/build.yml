name: Build AmneziaWG 5.4.213

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio rsync wget xz-utils git

      - name: Fetch QSDK 5.4.213 kernel source
        run: |
          set -eux
          mkdir -p work
          git clone --depth 1 --single-branch --branch NHSS.QSDK.12.5.r5 https://github.com/CodeLinaro-mirror/qsdk_oss_kernel_linux-ipq-5.4.git work/linux-5.4.213
          cd work/linux-5.4.213
          test "$(sed -n 's/^SUBLEVEL = //p' Makefile)" = "213"
          echo "KDIR=$PWD" >> "$GITHUB_ENV"

      - name: Prepare kernel tree
        run: |
          set -eux
          cd "$KDIR"
          cp "$GITHUB_WORKSPACE/config/qwrt-5.4.213.config" .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare modules_prepare
          echo "Kernel version: $(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelversion)"
          echo "CONFIG_PREEMPT=$(grep '^CONFIG_PREEMPT=' .config || true)"
          echo "CONFIG_MODULES=$(grep '^CONFIG_MODULES=' .config || true)"
          echo "CONFIG_MODVERSIONS=$(grep '^CONFIG_MODVERSIONS=' .config || true)"

      - name: Fetch AmneziaWG
        run: |
          set -eux
          git clone --depth 1 --branch v3.1.20260906 https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git awg

      - name: Apply Linux 5.4 and QSDK compatibility fixes
        run: |
          set -eux
          mkdir -p awg/src/compat/crypto/chacha/include/crypto
          cp "$GITHUB_WORKSPACE/patches/chacha.h" awg/src/compat/crypto/chacha/include/crypto/chacha.h

          python3 - <<'PY'
          from pathlib import Path

          p = Path("awg/src/compat/compat.h")
          s = p.read_text()

          # QSDK 12.5 is based on 5.4.213 but carries backported crypto APIs.
          # Do not enable AWG's old crypto-init compatibility implementation.
          needle = " && !defined(ISUBUNTU2004)\n#define COMPAT_INIT_CRYPTO"
          replacement = " && !defined(ISUBUNTU2004) && !defined(ISQSDK)\n#define COMPAT_INIT_CRYPTO"
          if needle not in s:
              raise SystemExit("COMPAT_INIT_CRYPTO block not found")
          s = s.replace(needle, replacement, 1)

          # QSDK's crypto/chacha.h uses the same include guard as the original
          # AWG compatibility header. For QSDK 5.4, include our wrapper explicitly.
          old = '#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 16, 0)\n#include <crypto/chacha.h>'
          new = '''#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 16, 0)\n#if defined(ISQSDK) && LINUX_VERSION_CODE < KERNEL_VERSION(5, 5, 0)\n#include "crypto/chacha/include/crypto/chacha.h"\n#else\n#include <crypto/chacha.h>\n#endif'''
          if old not in s:
              raise SystemExit("ChaCha include block not found")
          s = s.replace(old, new, 1)

          # QSDK already defines CHACHA_BLOCK_SIZE. Use Zinc's equivalent for the
          # local compatibility struct without redefining the kernel macro.
          old = "(CHACHA_BLOCK_SIZE / sizeof(u32))"
          new = "(CHACHA20_BLOCK_SIZE / sizeof(u32))"
          if old not in s:
              raise SystemExit("CHACHA_BLOCK_SIZE expression not found")
          s = s.replace(old, new, 1)

          # QSDK 5.4's kernel blake2s header is incompatible with AWG's bundled
          # Zinc header. The compatibility shim is only needed for newer kernels.
          old = '#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 19, 0)\n#include <crypto/blake2s.h>'
          new = '#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 19, 0) && !defined(ISQSDK)\n#include <crypto/blake2s.h>'
          if old not in s:
              raise SystemExit("blake2s compatibility block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Keep the compatibility header's guard distinct from QSDK's kernel guard.
          p = Path("awg/src/compat/crypto/chacha/include/crypto/chacha.h")
          s = p.read_text()
          s = s.replace("#ifndef _CRYPTO_CHACHA_H", "#ifndef __AWG_COMPAT_CRYPTO_CHACHA_H", 1)
          s = s.replace("#define _CRYPTO_CHACHA_H", "#define __AWG_COMPAT_CRYPTO_CHACHA_H", 1)
          s = s.replace("#endif /* _CRYPTO_CHACHA_H */", "#endif /* __AWG_COMPAT_CRYPTO_CHACHA_H */", 1)
          p.write_text(s)

          # No separate -include is needed: compat.h explicitly selects the wrapper.
          p = Path("awg/src/compat/Kbuild.include")
          s = p.read_text()
          marker = "ccflags-y += -include $(kbuild-dir)/compat/crypto/chacha/include/crypto/chacha.h"
          if marker in s:
              s = s.replace(marker + "\n", "")
          p.write_text(s)
          PY

          sed -n '890,905p' awg/src/compat/compat.h
          sed -n '1398,1432p' awg/src/compat/compat.h

      - name: Build AmneziaWG kernel module
        run: |
          set -eux
          cd awg/src
          make -C "$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M="$PWD" CONFIG_AMNEZIAWG=m WIREGUARD_VERSION=3.1.20260906 EXTRA_CFLAGS=-DISQSDK V=1 modules
          test -f amneziawg.ko
          modinfo ./amneziawg.ko || true
          strings ./amneziawg.ko | grep -E 'vermagic=|AmneziaWG|amneziawg' | head -20
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp amneziawg.ko "$GITHUB_WORKSPACE/out/amneziawg.ko"
          cp Module.symvers "$GITHUB_WORKSPACE/out/Module.symvers" || true

      - name: Verify module
        run: |
          set -eux
          file out/amneziawg.ko
          strings out/amneziawg.ko | grep 'vermagic=5.4.213 SMP preempt mod_unload aarch64'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-5.4.213
          path: out/
